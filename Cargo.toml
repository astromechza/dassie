[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
arbitrary = { version = "1", features = ["derive"] }
dassie-proto = { path = "crates/dassie-proto" }
flate2 = "1"
nix = { version = "0.31", default-features = false }
# rustls's crypto provider. Pure Rust (and asm) for x86_64 and aarch64, so the
# musl clippy aliases need no C cross toolchain; ring and aws-lc-rs both
# compile C in their build scripts.
rustls-graviola = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# Only reading and writing archives; the default `xattr` feature is for unpacking
# to disk, which dassie never does.
tar = { version = "0.4", default-features = false }
tempfile = "3"
# System roots through rustls-platform-verifier, not ureq's bundled
# webpki-roots (CDLA-Permissive-2.0). No `gzip`: blobs must arrive byte-exact.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }

# Shared lint policy. Every crate opts in with `[lints] workspace = true`.
# Cargo does not allow per-crate additions next to `workspace = true`, so
# per-crate exceptions or extra strictness go in `#![...]` at the crate root.
# CI runs clippy with `-D warnings`, so "warn" here fails CI.
[workspace.lints.rust]
# Crates that need unsafe opt in with `#![allow(unsafe_code)]` at the root.
unsafe_code = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# Selected restriction lints.
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"

# Cargo's own lints. `-D warnings` only reaches rustc and clippy, so these
# must be "deny" to fail CI. Dev-dependencies are not checked; cargo shear
# covers those.
[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"
