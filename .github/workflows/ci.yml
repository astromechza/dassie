name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Installs the channel, components and targets from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Format
        run: cargo fmt --all --check

      # Aliases from .cargo/config.toml; clippy also type-checks both targets.
      - name: Clippy (x86_64 musl)
        run: cargo lint-x86

      - name: Clippy (aarch64 musl)
        run: cargo lint-arm

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --workspace

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: cargo-deny@0.20.2,cargo-shear@1.14.0

      # Advisories, licenses, duplicate/wildcard deps and sources (deny.toml).
      - name: cargo-deny
        run: cargo deny check

      - name: Unused dependencies
        run: cargo shear

  # Short libFuzzer runs of the dassie-proto targets in fuzz/ (see README).
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: recv
            dict: proto.dict
          - target: roundtrip
            dict: proto.dict
          - target: flatten_model
            dict: ""
          - target: flatten_bytes
            dict: tar.dict
    env:
      # cargo-fuzz needs nightly. Pinned so the job does not drift; overrides
      # rust-toolchain.toml for every cargo call in this job.
      RUSTUP_TOOLCHAIN: nightly-2026-11-12
      CARGO_FUZZ_VERSION: 0.13.2
      CARGO_FUZZ_SHA256: b5b704018b63e0f151c17a057ac53b5111e1db545d1b9f72fee79f08a545931c
      TARGET: ${{ matrix.target }}
      DICT: ${{ matrix.dict }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - name: Install cargo-fuzz
        run: |
          curl -fsSL -o cargo-fuzz.tar.gz "https://github.com/rust-fuzz/cargo-fuzz/releases/download/${CARGO_FUZZ_VERSION}/cargo-fuzz-${CARGO_FUZZ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${CARGO_FUZZ_SHA256}  cargo-fuzz.tar.gz" | sha256sum --check
          tar -xzf cargo-fuzz.tar.gz -C "$HOME/.cargo/bin" cargo-fuzz
          rm cargo-fuzz.tar.gz

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: fuzz

      # The cargo-fuzz release binary is musl and defaults --target to its
      # own triple, but sanitizers need the dynamically linked gnu target.
      # Not every target has committed seeds, so create both corpus dirs.
      - name: Fuzz
        run: |
          mkdir -p "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET"
          cargo fuzz run --target x86_64-unknown-linux-gnu \
            "$TARGET" "fuzz/corpus/$TARGET" "fuzz/seeds/$TARGET" -- \
            -max_total_time=60 -max_len=131072 ${DICT:+"-dict=fuzz/$DICT"}

      - name: Upload crash inputs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@v2.90.3
        with:
          tool: zizmor@1.32.0

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      - name: shellcheck
        run: shellcheck -x guest/*.sh guest/kernel/*.sh

      - name: zizmor
        run: zizmor --format=github .github
        env:
          GH_TOKEN: ${{ github.token }}

      # Fails when .github/workflows/actions.lock is out of sync with the
      # workflows or a locked commit no longer verifies upstream.
      - name: Verify actions.lock
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
        env:
          GH_TOKEN: ${{ github.token }}

  # Boots the x86_64 guest under Firecracker on KVM and checks the lifecycle
  # events (guest/smoke-test.sh). The drills in guest/systemd/README.md stay
  # manual.
  kvm-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2.9.3

      # Outside target/, so rust-cache does not pick up the kernel build tree.
      - name: Set guest output dir
        run: echo "OUT=$RUNNER_TEMP/guest/x86_64" >> "$GITHUB_ENV"

      # The kernel only changes with guest/kernel/ (pins, fragments, script).
      - name: Restore guest kernel
        id: kernel
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/guest/x86_64/vmlinux
          key: guest-kernel-x86_64-${{ hashFiles('guest/kernel/**', 'guest/lib.sh') }}

      - name: Build guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc bison flex libelf-dev libssl-dev
          guest/kernel/build.sh x86_64

      # Saved straight away, so a failing boot does not mean a rebuild.
      - name: Save guest kernel
        if: steps.kernel.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/guest/x86_64/vmlinux
          key: ${{ steps.kernel.outputs.cache-primary-key }}

      - name: Build initramfs and rootfs
        run: |
          guest/initramfs.sh x86_64
          guest/rootfs.sh x86_64

      - name: Install Firecracker
        run: guest/firecracker.sh x86_64

      # Runners have /dev/kvm, but only root can open it by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot smoke test
        run: guest/smoke-test.sh x86_64
