[package]
name = "dassie-fuzz"
description = "cargo-fuzz targets for dassie-proto framing and the dassie-image flattener"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
dassie-image = { path = "../crates/dassie-image" }
dassie-proto = { path = "../crates/dassie-proto", features = ["arbitrary"] }
libfuzzer-sys = "0.4"
serde_json = "1"
tar = { version = "0.4", default-features = false }

# A workspace of its own, so the main workspace's stable clippy, cargo-deny
# and cargo-shear never see this nightly-only crate.
[workspace]
members = ["."]

[[bin]]
name = "recv"
path = "fuzz_targets/recv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flatten_model"
path = "fuzz_targets/flatten_model.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flatten_bytes"
path = "fuzz_targets/flatten_bytes.rs"
test = false
doc = false
bench = false
