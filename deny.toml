# cargo-deny policy: advisories, licenses, duplicate/wildcard deps, sources.
# Run with `cargo deny check`.

[graph]
# Only resolve dependencies for the targets we ship.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
all-features = true

[advisories]
# Vulnerabilities, unmaintained and yanked crates are all errors by default.
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses compatible with distributing dassie under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# Keep the allowlist stable as dependencies come and go.
unused-allowed-license = "allow"

[licenses.private]
# Workspace crates are publish = false.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
