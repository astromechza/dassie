<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>From OCI image to rootfs</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 14px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 11.5px; fill: #475569; }
      .m { font-size: 11px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lbl { font-size: 11px; fill: #475569; }
      .h { font-size: 11px; font-weight: 700; fill: #334155; }
      .built { stroke: #334155; stroke-width: 1.5; }
      .plan { stroke: #64748b; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .ln { stroke: #475569; stroke-width: 1.5; fill: none; }
      .lnp { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 4; }
      .gone { font-size: 11px; fill: #be123c; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; text-decoration: line-through; }
    </style>
  </defs>

  <rect width="1000" height="560" rx="14" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">From OCI image to rootfs</text>
  <text x="30" y="60" class="s">dassie-image (ADR 0007). No root, and no layer is ever unpacked to a host directory.</text>

  <!-- legend -->
  <line x1="730" y1="32" x2="766" y2="32" class="built"/>
  <text x="774" y="36" class="s">built (M1 A, B)</text>
  <line x1="856" y1="32" x2="892" y2="32" class="plan"/>
  <text x="900" y="36" class="s">planned</text>

  <!-- registry pull (M1 slice B) -->
  <rect x="30" y="80" width="200" height="46" rx="8" fill="#f8fafc" class="built"/>
  <text x="130" y="99" text-anchor="middle" class="t" font-size="13">registry pull</text>
  <text x="130" y="116" text-anchor="middle" class="s">missing blobs only, verified</text>
  <path d="M130,126 L130,148" class="ln" marker-end="url(#a)"/>
  <text x="138" y="142" class="lbl">or skopeo copy</text>

  <!-- 1. OCI layout -->
  <rect x="30" y="150" width="200" height="160" rx="10" fill="#fefce8" class="built"/>
  <text x="130" y="174" text-anchor="middle" class="t">OCI layout</text>
  <text x="130" y="191" text-anchor="middle" class="s">blob store = layer cache</text>
  <text x="44" y="216" class="m">index.json</text>
  <text x="44" y="234" class="m">→ manifest (platform)</text>
  <text x="44" y="252" class="m">→ config + layers</text>
  <text x="44" y="278" class="s">every read sha256-checked;</text>
  <text x="44" y="295" class="s">shared layers stored once</text>

  <!-- 2. pass 1 -->
  <rect x="270" y="150" width="200" height="160" rx="10" fill="#eef2ff" class="built"/>
  <text x="370" y="174" text-anchor="middle" class="t">pass 1: scan</text>
  <text x="370" y="191" text-anchor="middle" class="s">headers only, bottom → top</text>
  <text x="284" y="218" class="s">one winner per path</text>
  <text x="284" y="236" class="s">whiteouts and opaque dirs</text>
  <text x="284" y="254" class="s">hide lower layers only</text>
  <text x="284" y="280" class="s">→ fs size and inode count</text>

  <!-- 3. pass 2 -->
  <rect x="510" y="150" width="200" height="160" rx="10" fill="#eef2ff" class="built"/>
  <text x="610" y="174" text-anchor="middle" class="t">pass 2: emit</text>
  <text x="610" y="191" text-anchor="middle" class="s">re-reads and re-checks layers</text>
  <text x="524" y="218" class="s">1. every dir, sorted</text>
  <text x="524" y="236" class="s">2. other winners, in</text>
  <text x="538" y="254" class="s">layer order</text>
  <text x="524" y="272" class="s">3. <tspan class="m">/.dassie/image.json</tspan></text>
  <text x="524" y="295" class="s">headers + PAX copied as-is</text>

  <!-- 4. mkfs -->
  <rect x="750" y="150" width="220" height="160" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
  <text x="860" y="174" text-anchor="middle" class="m" font-size="13" font-weight="600">mkfs.ext4 -d -</text>
  <text x="860" y="191" text-anchor="middle" class="s">tar on stdin</text>
  <text x="764" y="218" class="s">temp file → rename, 0444</text>
  <text x="764" y="240" class="m">rootfs/sha256-&lt;hex&gt;.v1.ext4</text>
  <text x="764" y="266" class="s">same image → same bytes</text>
  <text x="764" y="284" class="s">already built → reused</text>

  <!-- arrows along the pipeline -->
  <path d="M230,230 L268,230" class="ln" marker-end="url(#a)"/>
  <path d="M470,230 L508,230" class="ln" marker-end="url(#a)"/>
  <path d="M710,230 L748,230" class="ln" marker-end="url(#a)"/>
  <text x="729" y="220" text-anchor="middle" class="lbl">tar</text>

  <!-- whiteout inset -->
  <rect x="30" y="350" width="474" height="180" rx="10" fill="#f8fafc" class="built"/>
  <text x="46" y="374" class="t" font-size="13">Whiteouts, by example</text>
  <text x="46" y="398" class="h">lower layer</text>
  <text x="196" y="398" class="h">upper layer</text>
  <text x="372" y="398" class="h">result</text>
  <text x="46" y="420" class="m">etc/keep "base"</text>
  <text x="46" y="438" class="m">etc/gone</text>
  <text x="46" y="456" class="m">var/cache/a</text>
  <text x="196" y="420" class="m">etc/keep "upper"</text>
  <text x="196" y="438" class="gone">etc/.wh.gone</text>
  <text x="196" y="456" class="gone">var/cache/.wh..wh..opq</text>
  <text x="196" y="474" class="m">var/cache/c</text>
  <text x="372" y="420" class="m">etc/keep "upper"</text>
  <text x="372" y="438" class="m">var/cache/c</text>
  <text x="178" y="438" text-anchor="middle" class="t" fill="#64748b">+</text>
  <text x="358" y="438" text-anchor="middle" class="t" fill="#64748b">=</text>
  <text x="46" y="500" class="s">A whiteout hides what lower layers put there, never what its own layer adds.</text>
  <text x="46" y="517" class="s">An opaque dir hides everything lower layers put under it.</text>

  <!-- shared, read-only use (planned) -->
  <path d="M860,312 L597,398" class="lnp" marker-end="url(#a)"/>
  <path d="M860,312 L747,398" class="lnp" marker-end="url(#a)"/>
  <path d="M860,312 L897,398" class="lnp" marker-end="url(#a)"/>
  <rect x="532" y="400" width="130" height="40" rx="8" fill="#ffffff" class="plan"/>
  <text x="597" y="424" text-anchor="middle" class="m">fc@app-blue</text>
  <rect x="682" y="400" width="130" height="40" rx="8" fill="#ffffff" class="plan"/>
  <text x="747" y="424" text-anchor="middle" class="m">fc@app-green</text>
  <rect x="832" y="400" width="130" height="40" rx="8" fill="#ffffff" class="plan"/>
  <text x="897" y="424" text-anchor="middle" class="m">clone (M5)</text>
  <text x="532" y="472" class="s">One file, attached read-only to every VM of that version, with</text>
  <text x="532" y="490" class="s">an overlay in the guest (slice C). It is never modified, so M5</text>
  <text x="532" y="508" class="s">snapshots stay valid, and M6 GC counts snapshots and VMs as</text>
  <text x="532" y="526" class="s">references.</text>
</svg>
