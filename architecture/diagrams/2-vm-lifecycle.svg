<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One VM: boot to restart</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .n { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .t { font-size: 13px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 11px; fill: #475569; }
      .m { font-size: 10.5px; fill: #334155; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .ln { stroke: #475569; stroke-width: 1.5; fill: none; }
      .host { fill: #f1f5f9; stroke: #334155; stroke-width: 1.5; }
      .boot { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.5; }
      .run { fill: #ecfdf5; stroke: #059669; stroke-width: 1.5; }
      .stop { fill: #fff1f2; stroke: #e11d48; stroke-width: 1.5; }
      .ev { font-size: 10.5px; font-weight: 600; fill: #047857; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1000" height="470" rx="14" fill="#ffffff"/>
  <text x="30" y="38" font-size="20" font-weight="700" fill="#0f172a">One VM, from boot to restart</text>
  <text x="30" y="60" class="s">The loop systemd runs with no daemon. Green tags are events sent to the host on vsock port 1024.</text>

  <!-- legend -->
  <rect x="640" y="26" width="14" height="14" rx="3" class="host"/><text x="660" y="37" class="s">host</text>
  <rect x="700" y="26" width="14" height="14" rx="3" class="boot"/><text x="720" y="37" class="s">boot (initramfs)</text>
  <rect x="818" y="26" width="14" height="14" rx="3" class="run"/><text x="838" y="37" class="s">running</text>
  <rect x="898" y="26" width="14" height="14" rx="3" class="stop"/><text x="918" y="37" class="s">exit</text>

  <!-- top row: left to right -->
  <g>
    <rect x="31" y="92" width="170" height="104" rx="10" class="host"/>
    <circle cx="51" cy="112" r="10" fill="#334155"/><text x="51" y="116" text-anchor="middle" class="n">1</text>
    <text x="68" y="117" class="t">systemd</text>
    <text x="45" y="142" class="s">starts fc@&lt;id&gt;.service</text>
    <text x="45" y="160" class="s">removes the stale vsock</text>
    <text x="45" y="176" class="s">socket first</text>
  </g>
  <g>
    <rect x="223" y="92" width="170" height="104" rx="10" class="host"/>
    <circle cx="243" cy="112" r="10" fill="#334155"/><text x="243" y="116" text-anchor="middle" class="n">2</text>
    <text x="260" y="117" class="t">firecracker</text>
    <text x="237" y="142" class="m">--no-api --config-file</text>
    <text x="237" y="160" class="s">boots vmlinux + shared</text>
    <text x="237" y="176" class="s">initramfs; rootfs = vda</text>
  </g>
  <g>
    <rect x="415" y="92" width="170" height="104" rx="10" class="boot"/>
    <circle cx="435" cy="112" r="10" fill="#4f46e5"/><text x="435" y="116" text-anchor="middle" class="n">3</text>
    <text x="452" y="117" class="t">dassie-init, PID 1</text>
    <text x="429" y="142" class="s">mounts devtmpfs, proc,</text>
    <text x="429" y="160" class="s">sysfs; /dev/console</text>
    <text x="429" y="176" class="s">becomes fds 0–2</text>
  </g>
  <g>
    <rect x="607" y="92" width="170" height="104" rx="10" class="boot"/>
    <circle cx="627" cy="112" r="10" fill="#4f46e5"/><text x="627" y="116" text-anchor="middle" class="n">4</text>
    <text x="644" y="117" class="t">switch-root</text>
    <text x="621" y="142" class="s">overlay: ro vda + tmpfs</text>
    <text x="621" y="160" class="s">move /dev /proc /sys</text>
    <text x="621" y="176" class="s">chroot; /dev/std*, shm</text>
  </g>
  <g>
    <rect x="799" y="92" width="170" height="104" rx="10" class="run"/>
    <circle cx="819" cy="112" r="10" fill="#059669"/><text x="819" y="116" text-anchor="middle" class="n">5</text>
    <text x="836" y="117" class="t">configure</text>
    <text x="813" y="142" class="s">lo + eth0 up (ip=)</text>
    <text x="813" y="160" class="m">/.dassie/image.json</text>
    <text x="813" y="176" class="s">+ dassie.* cmdline</text>
  </g>

  <!-- bottom row: right to left -->
  <g>
    <rect x="799" y="270" width="170" height="104" rx="10" class="run"/>
    <circle cx="819" cy="290" r="10" fill="#059669"/><text x="819" y="294" text-anchor="middle" class="n">6</text>
    <text x="836" y="295" class="t">spawn entrypoint</text>
    <text x="813" y="320" class="s">Entrypoint/Cmd, Env, Dir</text>
    <text x="813" y="338" class="s">User; console → its uid</text>
    <rect x="813" y="348" width="62" height="18" rx="9" fill="#d1fae5"/><text x="844" y="361" text-anchor="middle" class="ev">started</text>
  </g>
  <g>
    <rect x="607" y="270" width="170" height="104" rx="10" class="run"/>
    <circle cx="627" cy="290" r="10" fill="#059669"/><text x="627" y="294" text-anchor="middle" class="n">7</text>
    <text x="644" y="295" class="t">readiness</text>
    <text x="621" y="320" class="s">TCP connect to the port,</text>
    <text x="621" y="338" class="s">or at once with no port</text>
    <rect x="621" y="348" width="50" height="18" rx="9" fill="#d1fae5"/><text x="646" y="361" text-anchor="middle" class="ev">ready</text>
  </g>
  <g>
    <rect x="415" y="270" width="170" height="104" rx="10" class="stop"/>
    <circle cx="435" cy="290" r="10" fill="#e11d48"/><text x="435" y="294" text-anchor="middle" class="n">8</text>
    <text x="452" y="295" class="t">entrypoint exits</text>
    <text x="429" y="320" class="s">crash, clean exit, or</text>
    <text x="429" y="338" class="s">stop → SIGTERM → KILL</text>
    <rect x="429" y="348" width="54" height="18" rx="9" fill="#d1fae5"/><text x="456" y="361" text-anchor="middle" class="ev">exited</text>
  </g>
  <g>
    <rect x="223" y="270" width="170" height="104" rx="10" class="stop"/>
    <circle cx="243" cy="290" r="10" fill="#e11d48"/><text x="243" y="294" text-anchor="middle" class="n">9</text>
    <text x="260" y="295" class="t">guest reboots</text>
    <text x="237" y="320" class="s">kill stragglers, sync,</text>
    <text x="237" y="338" class="m">reboot(RB_AUTOBOOT)</text>
    <text x="237" y="356" class="s">PID 1 never exits</text>
  </g>
  <g>
    <rect x="31" y="270" width="170" height="104" rx="10" class="host"/>
    <circle cx="51" cy="290" r="10" fill="#334155"/><text x="51" y="294" text-anchor="middle" class="n">10</text>
    <text x="68" y="295" class="t">firecracker exits 0</text>
    <text x="45" y="320" class="m">Restart=always</text>
    <text x="45" y="338" class="s">gives up after 5 starts</text>
    <text x="45" y="356" class="s">in 60 s</text>
  </g>

  <!-- arrows -->
  <path d="M201,144 L221,144" class="ln" marker-end="url(#a)"/>
  <path d="M393,144 L413,144" class="ln" marker-end="url(#a)"/>
  <path d="M585,144 L605,144" class="ln" marker-end="url(#a)"/>
  <path d="M777,144 L797,144" class="ln" marker-end="url(#a)"/>
  <path d="M884,196 L884,268" class="ln" marker-end="url(#a)"/>
  <path d="M799,322 L779,322" class="ln" marker-end="url(#a)"/>
  <path d="M607,322 L587,322" class="ln" marker-end="url(#a)"/>
  <path d="M415,322 L395,322" class="ln" marker-end="url(#a)"/>
  <path d="M223,322 L203,322" class="ln" marker-end="url(#a)"/>
  <path d="M116,270 L116,198" class="ln" marker-end="url(#a)"/>
  <text x="124" y="238" class="s">restart after 1 s</text>

  <!-- setup error shortcut -->
  <path d="M500,196 C500,232 320,232 308,268" stroke="#e11d48" stroke-width="1.3" fill="none" stroke-dasharray="4 4" marker-end="url(#a)"/>
  <text x="512" y="222" class="s" fill="#be123c">setup error or panic</text>

  <text x="30" y="420" class="s">Graceful stop: systemctl stop → ExecStop sends a control-channel stop → step 8 → guest reboots → Firecracker exits, and</text>
  <text x="30" y="438" class="s">systemd does not restart it. A killed Firecracker skips 3–9: systemd sees the main process die and goes straight back to step 1.</text>
</svg>
